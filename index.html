<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Magazzino FB Demo</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}header{background:#0f172a;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:3}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#cbd5e1;font-size:13px}main{max-width:980px;margin:auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.card,.row{background:#fff;border:1px solid #e5e7eb;border-radius:14px}.card{padding:12px}.card b{font-size:22px;display:block}.card span,.meta{font-size:12px;color:#6b7280}.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}input,select,button{font:inherit}input,select{width:100%;min-height:46px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;background:#fff;font-size:16px}button{min-height:44px;border:0;border-radius:11px;padding:0 14px;font-weight:650}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;background:#fff;border:1px solid #d1d5db}.chip.active{background:#dbeafe;border-color:#2563eb;color:#1d4ed8}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 14px}.progress div{height:100%;background:#2563eb;width:0}.list{display:grid;gap:8px}.row{padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.name{font-weight:750}.value{text-align:right;font-size:18px;font-weight:800}.ok{color:#15803d;font-size:12px}.pending{color:#6b7280;font-size:12px}.row>button{background:transparent;text-align:left;padding:0;min-height:0}.section{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.section h2{font-size:18px;margin:0}dialog{border:0;border-radius:18px;padding:0;max-width:620px;width:calc(100% - 24px)}dialog::backdrop{background:#0f172a99}.modal{padding:18px}.modal h2{margin:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:#4b5563;margin-top:10px}label input,label select{margin-top:5px}.calc{background:#eff6ff;border-radius:12px;padding:12px;margin-top:12px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:6px;margin-top:5px}.stepper button{font-size:22px;background:#e5e7eb}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.tools,.grid2{grid-template-columns:1fr}}</style></head><body><header><h1>Magazzino FB</h1><p>Demo inventario magazzino alternativo · 62 prodotti iniziali</p></header><main><section class="stats"><div class="card"><b id="s1">0</b><span>Prodotti</span></div><div class="card"><b id="s2">0</b><span>Verificati</span></div><div class="card"><b id="s3">0</b><span>Pallet</span></div><div class="card"><b id="s4">0</b><span>Pezzi calcolati</span></div></section><div class="progress"><div id="bar"></div></div><section class="tools"><input id="search" type="search" placeholder="Cerca prodotto o marca…"><button class="primary" id="add">+ Prodotto</button></section><div class="filters" id="filters"><button class="chip active" data-f="all">Tutti</button><button class="chip" data-f="pending">Da verificare</button><button class="chip" data-f="pieces">Pallet × pezzi</button><button class="chip" data-f="pallet">Solo pallet</button></div><div class="section"><h2>Prodotti <span id="count" class="meta"></span></h2><button class="secondary" id="reset">Ripristina demo</button></div><section class="list" id="list"></section></main><dialog id="dlg"><form class="modal" id="form"><h2 id="title">Prodotto</h2><input type="hidden" id="id"><div class="grid2"><label>Prodotto<input id="name" required></label><label>Marca<input id="brand"></label></div><label>Modalità<select id="mode"><option value="pieces">Pallet × pezzi + sfusi</option><option value="pallet">Solo pallet</option></select></label><div id="pf"><div class="grid2"><label>Pezzi per pallet<input id="per" type="number" min="0"></label><label>N° pallet<input id="pallets" type="number" min="0"></label></div><label>Pezzi sfusi<input id="loose" type="number" min="0"></label><div class="calc">Totale: <b id="calc">0 pz</b></div></div><div id="qf" hidden><label>Numero pallet<div class="stepper"><button type="button" id="minus">−</button><input id="qty" type="number" min="0"><button type="button" id="plus">+</button></div></label></div><label><input id="verified" type="checkbox" style="width:auto;min-height:auto;margin-right:7px">Prodotto verificato</label><div class="actions"><button type="button" class="secondary" id="cancel">Annulla</button><button class="primary" type="submit">Salva</button></div></form></dialog><script>const RAW=[["Gomma Tara","Aglumix","pieces",900,28,0],["Gomma Tara","Gtc","pieces",1000,0,0],["Proteine idrolizzate","Glanbia","pieces",700,1,0],["Confettura Fragola","Pangroup","pieces",792,3,0],["Confettura Ciliegia","Pangroup","pieces",792,1,0],["Confettura Fragola","Apicoltura","pallet",0,0,0],["Confettura Pesca","Apicoltura","pieces",528,2,0],["Confettura Frutti di Bosco","Pangroup","pieces",792,2,0],["Confettura Albicocca","Pangroup","pieces",792,2,0],["Confettura mirtillo","Pangroup","pieces",792,1,0],["Estratto di Lievito","Leiber","pieces",600,4,0],["Maltodestrina It 19","Tereos","pieces",675,0,0],["Cereal Big Bag","Grana","pieces",450,7,0],["Cereal scatole","Grana","pieces",300,1,0],["Acido Citrico","Nsw Toscana","pieces",1000,16,0],["Siero del latte","Milcore","pallet",0,0,0],["Sciroppo di Glucosio","Tereos","pieces",750,0,0],["Caffè spray instant","Comintrade","pieces",300,17,0],["Caffè ginseng","Comintrade","pieces",240,0,0],["Caffè top quality","Prontofood","pieces",276,0,0],["Caffè oro","Newchem","pieces",432,7,0],["Maltodestrina 19D (clpa)","Roquette","pieces",750,12,0],["Birra box 25lt","Naturiex","pieces",36,9,0],["Nocciolì","Apicoltura","pieces",792,0,0],["Nocciolì","Pangroup","pieces",792,0,0],["Miele","Apicoltura","pieces",88,1,0],["Acero","Apicoltura","pieces",0,1,0],["Zucchero semolato bianco","Eridania","pieces",900,0,0],["Teli copripallet grande","len Service","pieces",50,1,0],["Teli copripallet standard","len Service","pieces",20,3,0],["Sprite","sibeg","pieces",128,0,0],["Fanta","sibeg","pieces",128,4,0],["Big bag orzo","Crastan","pieces",380,0,0],["Orzo sacchetti","Crastan","pieces",360,0,0],["Bicchieri IO BEVO","goldplast","pallet",0,6,6],["Bicchieri Pellegrini","goldplast","pallet",0,1,1],["Biscotto","Emmepi dolci","pieces",400,0,0],["EPAL","","pallet",0,114,114],["Etichette","ro.ma","pallet",0,2,2],["Frutta albicocca","Capuzzo","pieces",300,0,0],["Frutta frutti di bosco","Capuzzo","pieces",280,0,0],["Frutta mela","Capuzzo","pieces",660,0,0],["Frutta pesca","","pallet",0,0,0],["Frutta prugna","Capuzzo","pieces",320,0,0],["MPC proteine del latte","Inleit","pieces",1000,0,0],["WPC proteine del Siero","Mamomilk","pieces",600,8,0],["Coca cola originale 20 lt","Coca-cola","pieces",30,13,0],["Taniche 5lt","lar","pallet",0,0,0],["Vesciche 75","sholle","pieces",2000,4,0],["Formaggio cheese powder mozzarella","icom italy","pieces",800,2,0],["Inulina","eigenman veronelli","pieces",1000,0,0],["Succo arancia (SAGF-14)","agrumaria","pieces",1040,14,0],["Latte intero","Lactalis","pieces",1000,3,0],["Fruttosio sacchi","","pieces",1000,12,0],["Fruttosio Big Bag","","pieces",1000,12,0],["Cola part 1","Agrumaria","pallet",0,1,1],["Cola parte B","Agrumaria","pallet",0,1,1],["Acido Ascorbico","","pallet",0,1,1],["Latte parzialmente  07264746","","pieces",576,0,0],["pellicola rotoli mano","","pallet",0,1,1],["Reggette","","pallet",0,1,1],["secna Caramello (Liquidi)","","pallet",0,1,1]];const SEED=RAW.map((x,i)=>({id:i+1,name:x[0],brand:x[1],mode:x[2],per:x[3],pallets:x[4],qty:x[5],loose:0,verified:false})),KEY='mfb-demo-v2';let items=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch{return structuredClone(SEED)}})(),filter='all';const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('it-IT').format(+n||0),total=p=>p.mode==='pieces'?(+p.per||0)*(+p.pallets||0)+(+p.loose||0):(+p.qty||0),save=()=>localStorage.setItem(KEY,JSON.stringify(items));function stats(){s1.textContent=items.length;const v=items.filter(x=>x.verified).length;s2.textContent=v;bar.style.width=(items.length?v/items.length*100:0)+'%';s3.textContent=fmt(items.reduce((a,p)=>a+(p.mode==='pieces'?+p.pallets||0:+p.qty||0),0));s4.textContent=fmt(items.reduce((a,p)=>a+(p.mode==='pieces'?total(p):0),0))}function render(){const q=search.value.toLowerCase().trim(),a=items.filter(p=>(!q||(p.name+' '+p.brand).toLowerCase().includes(q))&&(filter==='all'||filter==='pending'&&!p.verified||p.mode===filter));list.innerHTML='';count.textContent='('+a.length+')';for(const p of a){const r=document.createElement('article');r.className='row';const b=document.createElement('button');b.type='button';b.innerHTML='<div class="name"></div><div class="meta"></div>';b.firstChild.textContent=p.name;b.lastChild.textContent=(p.brand?p.brand+' · ':'')+(p.mode==='pieces'?'Pallet × pezzi':'Solo pallet');b.onclick=()=>edit(p.id);const v=document.createElement('div');v.innerHTML='<div class="value"></div><div></div>';v.firstChild.textContent=fmt(total(p))+' '+(p.mode==='pieces'?'pz':'pallet');v.lastChild.className=p.verified?'ok':'pending';v.lastChild.textContent=p.verified?'✓ Verificato':'Da verificare';r.append(b,v);list.append(r)}stats()}function fields(){pf.hidden=mode.value!=='pieces';qf.hidden=mode.value!=='pallet';calc.textContent=fmt((+per.value||0)*(+pallets.value||0)+(+loose.value||0))+' pz'}function edit(i){const p=items.find(x=>x.id===i);id.value=p.id;title.textContent=p.name;name.value=p.name;brand.value=p.brand;mode.value=p.mode;per.value=p.per||0;pallets.value=p.pallets||0;loose.value=p.loose||0;qty.value=p.qty||0;verified.checked=p.verified;fields();dlg.showModal()}form.onsubmit=e=>{e.preventDefault();let p=items.find(x=>x.id===+id.value);if(!p){p={id:Date.now(),name:'',brand:'',mode:'pieces',per:0,pallets:0,qty:0,loose:0,verified:false};items.push(p)}p.name=name.value.trim()||'Prodotto';p.brand=brand.value.trim();p.mode=mode.value;p.per=Math.max(0,+per.value||0);p.pallets=Math.max(0,+pallets.value||0);p.loose=Math.max(0,+loose.value||0);p.qty=Math.max(0,+qty.value||0);p.verified=verified.checked;save();dlg.close();render()};add.onclick=()=>{id.value='';title.textContent='Nuovo prodotto';name.value=brand.value='';mode.value='pieces';per.value=pallets.value=loose.value=qty.value=0;verified.checked=false;fields();dlg.showModal()};cancel.onclick=()=>dlg.close();mode.onchange=fields;[per,pallets,loose].forEach(x=>x.oninput=fields);minus.onclick=()=>qty.value=Math.max(0,(+qty.value||0)-1);plus.onclick=()=>qty.value=(+qty.value||0)+1;search.oninput=render;filters.onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()};reset.onclick=()=>{if(confirm('Ripristinare i dati iniziali?')){items=structuredClone(SEED);save();render()}};render();</script></body></html>
