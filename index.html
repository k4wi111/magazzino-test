<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magazzino FB Demo</title><meta name="theme-color" content="#0f172a">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
header{background:#0f172a;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:4}header h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:1000px;margin:auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:#6b7280}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}.data-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.data-tools button{flex:0 0 auto}.hint{font-size:12px;color:#6b7280;margin-top:6px;line-height:1.35}input,select,button{font:inherit}input,select{width:100%;min-height:46px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
button{min-height:44px;border:0;border-radius:11px;padding:0 14px;font-weight:650;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;background:#fff;border:1px solid #d1d5db}.chip.active{background:#dbeafe;border-color:#2563eb;color:#1d4ed8}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0 14px}.progress>div{height:100%;background:#2563eb;width:0}
.list{display:grid;gap:8px}.row{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.name{font-weight:750}.meta{font-size:13px;color:#6b7280;margin-top:3px}.value{text-align:right;font-size:18px;font-weight:800}.ok{font-size:12px;color:#15803d}.pending{font-size:12px;color:#6b7280}
.row button{background:transparent;padding:0;text-align:inherit;min-height:0;border-radius:0}.empty{text-align:center;color:#6b7280;padding:30px 0}
dialog{border:0;border-radius:18px;padding:0;max-width:620px;width:calc(100% - 24px)}dialog::backdrop{background:rgba(15,23,42,.55)}.modal{padding:18px}.modal h2{margin:0 0 4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:#4b5563;margin-top:10px}label input,label select{margin-top:5px}.calc{background:#eff6ff;border-radius:12px;padding:12px;margin-top:12px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:6px;margin-top:5px}.stepper button{font-size:22px;background:#e5e7eb}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.section-title h2{font-size:18px;margin:0}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#f3f4f6;font-size:11px;margin-left:5px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.data-tools{display:grid;grid-template-columns:1fr 1fr}.data-tools button{width:100%}.grid2{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr) auto}}
</style></head><body>
<header><h1>Magazzino FB</h1><p>Demo inventario magazzino alternativo · dati iniziali dal file Excel</p></header>
<main>
<section class="stats">
<div class="card stat"><b id="sProducts">0</b><span>Prodotti</span></div>
<div class="card stat"><b id="sVerified">0</b><span>Verificati</span></div>
<div class="card stat"><b id="sPallets">0</b><span>Pallet</span></div>
<div class="card stat"><b id="sPieces">0</b><span>Pezzi calcolati</span></div>
</section>
<div class="progress"><div id="bar"></div></div>
<section class="tools"><input id="search" type="search" placeholder="Cerca prodotto o marca…"><button class="primary" id="add">+ Prodotto</button></section>
<section class="data-tools"><button class="secondary" id="exportPdf">Esporta PDF</button><button class="secondary" id="exportJson">Salva JSON</button><button class="secondary" id="importJson">Importa JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden></section>
<div class="filters" id="filters">
<button class="chip active" data-f="all">Tutti</button><button class="chip" data-f="pending">Da verificare</button>
<button class="chip" data-f="pieces">Conteggio completo</button><button class="chip" data-f="pallet">Solo n° pallet</button><button class="chip" data-f="direct">Quantità diretta</button>
</div>
<div class="section-title"><h2>Prodotti <span class="badge" id="count"></span></h2><button class="secondary" id="reset">Ripristina demo</button></div>
<section class="list" id="list"></section><div id="empty" class="empty" hidden>Nessun prodotto trovato.</div>
</main>
<dialog id="dlg"><form class="modal" id="form">
<h2 id="dlgTitle">Prodotto</h2><div class="meta" id="dlgBrand"></div>
<input type="hidden" id="id">
<div class="grid2"><label id="nameWrap">Nome prodotto<input id="productName"></label><label>Marca<input id="brand"></label></div>
<label>Modalità di conteggio<select id="mode"><option value="pieces">Pallet completi + pezzi sfusi</option><option value="pallet">Solo numero pallet</option><option value="direct">Quantità diretta</option></select></label><div class="hint" id="modeHelp"></div>
<div id="piecesFields"><div class="grid2"><label>Pezzi per pallet<input id="per" type="number" min="0" step="1"></label><label>N° pallet<input id="pallets" type="number" min="0" step="1"></label></div><label>Pezzi sfusi<input id="loose" type="number" min="0" step="1"></label><div class="calc">Totale: <b id="calc">0 pz</b></div></div>
<div id="palletFields" hidden><label>Numero pallet<div class="stepper"><button type="button" id="minus">−</button><input id="qtyPallet" type="number" min="0" step="1"><button type="button" id="plus">+</button></div></label></div>
<div id="directFields" hidden><div class="grid2"><label>Quantità<input id="qty" type="number" min="0" step="1"></label><label>Unità<input id="unit" placeholder="pz, rotoli, scatole…"></label></div></div>
<label><input id="verified" type="checkbox" style="width:auto;min-height:auto;margin-right:7px">Prodotto verificato</label>
<div class="actions"><button type="button" class="danger" id="del">Elimina</button><button type="button" class="secondary" id="cancel">Annulla</button><button class="primary" type="submit">Salva</button></div>
</form></dialog>
<script>

,"verified":false},{"id":29,"name":"Teli copripallet grande","brand":"len Service","mode":"pieces","per":50,"pallets":1,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":30,"name":"Teli copripallet standard","brand":"len Service","mode":"pieces","per":20,"pallets":3,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":31,"name":"Sprite","brand":"sibeg","mode":"pieces","per":128,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":32,"name":"Fanta","brand":"sibeg","mode":"pieces","per":128,"pallets":4,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":33,"name":"Big bag orzo","brand":"Crastan","mode":"pieces","per":380,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":34,"name":"Orzo sacchetti","brand":"Crastan","mode":"pieces","per":360,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":35,"name":"Bicchieri IO BEVO","brand":"goldplast","mode":"pallet","per":0,"pallets":6,"loose":0,"qty":6,"unit":"pallet","verified":false},{"id":36,"name":"Bicchieri Pellegrini","brand":"goldplast","mode":"pallet","per":0,"pallets":1,"loose":0,"qty":1,"unit":"pallet","verified":false},{"id":37,"name":"Biscotto","brand":"Emmepi dolci","mode":"pieces","per":400,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":38,"name":"EPAL","brand":"","mode":"pallet","per":0,"pallets":114,"loose":0,"qty":114,"unit":"pallet","verified":false},{"id":39,"name":"Etichette","brand":"ro.ma","mode":"pallet","per":0,"pallets":2,"loose":0,"qty":2,"unit":"pallet","verified":false},{"id":40,"name":"Frutta albicocca","brand":"Capuzzo","mode":"pieces","per":300,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":41,"name":"Frutta frutti di bosco","brand":"Capuzzo","mode":"pieces","per":280,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":42,"name":"Frutta mela","brand":"Capuzzo","mode":"pieces","per":660,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":43,"name":"Frutta pesca","brand":"","mode":"pallet","per":0,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":44,"name":"Frutta prugna","brand":"Capuzzo","mode":"pieces","per":320,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":45,"name":"MPC proteine del latte","brand":"Inleit","mode":"pieces","per":1000,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":46,"name":"WPC proteine del Siero","brand":"Mamomilk","mode":"pieces","per":600,"pallets":8,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":47,"name":"Coca cola originale 20 lt","brand":"Coca-cola","mode":"pieces","per":30,"pallets":13,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":48,"name":"Taniche 5lt","brand":"lar","mode":"pallet","per":0,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":49,"name":"Vesciche 75","brand":"sholle","mode":"pieces","per":2000,"pallets":4,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":50,"name":"Formaggio cheese powder mozzarella","brand":"icom italy","mode":"pieces","per":800,"pallets":2,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":51,"name":"Inulina","brand":"eigenman veronelli","mode":"pieces","per":1000,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":52,"name":"Succo arancia (SAGF-14)","brand":"agrumaria","mode":"pieces","per":1040,"pallets":14,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":53,"name":"Latte intero","brand":"Lactalis","mode":"pieces","per":1000,"pallets":3,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":54,"name":"Fruttosio sacchi","brand":"","mode":"pieces","per":1000,"pallets":12,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":55,"name":"Fruttosio Big Bag","brand":"","mode":"pieces","per":1000,"pallets":12,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":56,"name":"Cola part 1","brand":"Agrumaria","mode":"pallet","per":0,"pallets":1,"loose":0,"qty":1,"unit":"pallet","verified":false},{"id":57,"name":"Cola parte B","brand":"Agrumaria","mode":"pallet","per":0,"pallets":1,"loose":0,"qty":1,"unit":"pallet","verified":false},{"id":58,"name":"Acido Ascorbico","brand":"","mode":"pallet","per":0,"pallets":1,"loose":0,"qty":1,"unit":"pallet","verified":false},{"id":59,"name":"Latte parzialmente  07264746","brand":"","mode":"pieces","per":576,"pallets":0,"loose":0,"qty":0,"unit":"pallet","verified":false},{"id":60,"name":"pellicola rotoli mano","brand":"","mode":"pallet","per":0,"pallets":1,"loose":0,"qty":1,"unit":"pallet","verified":false},{"id":61,"name":"Reggette","brand":"","mode":"pallet","per":0,"pallets":1,"loose":0,"qty":1,"unit":"pallet","verified":false},{"id":62,"name":"secna Caramello (Liquidi)","brand":"","mode":"pallet","per":0,"pallets":1,"loose":0,"qty":1,"unit":"pallet","verified":false}];
const KEY='magazzino-fb-demo-v1';
let items=load(),filter='all';
const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('it-IT').format(Number(n)||0);
function cloneSeed(){return SEED.map(x=>({...x}))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:cloneSeed()}catch{return cloneSeed()}}
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function total(p){return p.mode==='pieces'?(+p.per||0)*(+p.pallets||0)+(+p.loose||0):p.mode==='pallet'?(+p.qty||0):(+p.qty||0)}
function modeLabel(m){return m==='pieces'?'Conteggio completo':m==='pallet'?'Solo n° pallet':'Quantità diretta'}
function unitLabel(p){return p.mode==='pieces'?'pz':p.mode==='pallet'?'pallet':(p.unit||'unità')}
function stats(){$('#sProducts').textContent=items.length;const v=items.filter(x=>x.verified).length;$('#sVerified').textContent=v;$('#bar').style.width=(items.length?v/items.length*100:0)+'%';$('#sPallets').textContent=fmt(items.reduce((a,p)=>a+(p.mode==='pieces'?(+p.pallets||0):p.mode==='pallet'?(+p.qty||0):0),0));$('#sPieces').textContent=fmt(items.reduce((a,p)=>a+(p.mode==='pieces'?total(p):0),0))}
function render(){const q=$('#search').value.trim().toLowerCase();const arr=items.filter(p=>(!q||(p.name+' '+p.brand).toLowerCase().includes(q))&&(filter==='all'||filter==='pending'&&!p.verified||p.mode===filter));$('#list').innerHTML='';$('#count').textContent=arr.length;$('#empty').hidden=!!arr.length;for(const p of arr){const el=document.createElement('article');el.className='row';const left=document.createElement('button');left.type='button';left.innerHTML='<div class="name"></div><div class="meta"></div>';left.querySelector('.name').textContent=p.name;left.querySelector('.meta').textContent=(p.brand?p.brand+' · ':'')+modeLabel(p.mode);left.addEventListener('click',()=>openEdit(p.id));const right=document.createElement('div');right.innerHTML='<div class="value"></div><div class="'+(p.verified?'ok':'pending')+'"></div>';right.querySelector('.value').textContent=fmt(total(p))+' '+unitLabel(p);right.lastChild.textContent=p.verified?'✓ Verificato':'Da verificare';el.append(left,right);$('#list').append(el)}stats()}
function showFields(){const m=$('#mode').value;$('#piecesFields').hidden=m!=='pieces';$('#palletFields').hidden=m!=='pallet';$('#directFields').hidden=m!=='direct';$('#modeHelp').textContent=m==='pieces'?'Usa questa modalità quando conosci i pezzi contenuti in ogni pallet. Il totale viene calcolato automaticamente: n° pallet × pezzi per pallet + eventuali pezzi sfusi.':m==='pallet'?'Usa questa modalità quando vuoi contare soltanto quanti pallet sono presenti, senza calcolare i singoli pezzi.':'Usa questa modalità per articoli che vuoi contare direttamente in pezzi, rotoli, scatole o altra unità.';calc()}
function calc(){$('#calc').textContent=fmt((+$('#per').value||0)*(+$('#pallets').value||0)+(+$('#loose').value||0))+' pz'}
function openEdit(id){const p=items.find(x=>x.id===id);if(!p)return;$('#id').value=p.id;$('#dlgTitle').textContent=p.name;$('#dlgBrand').textContent=p.brand||'Nessuna marca';$('#nameWrap').hidden=true;$('#productName').value=p.name;$('#brand').value=p.brand;$('#mode').value=p.mode;$('#per').value=p.per||0;$('#pallets').value=p.pallets||0;$('#loose').value=p.loose||0;$('#qtyPallet').value=p.mode==='pallet'?(p.qty||0):0;$('#qty').value=p.mode==='direct'?(p.qty||0):0;$('#unit').value=p.unit||'';$('#verified').checked=!!p.verified;$('#del').hidden=false;showFields();$('#dlg').showModal()}
$('#form').addEventListener('submit',e=>{e.preventDefault();const id=+$('#id').value;let p=items.find(x=>x.id===id);const isNew=!p;if(isNew){const newName=$('#productName').value.trim();if(!newName){alert('Inserisci il nome del prodotto.');return}p={id:Date.now(),name:newName,brand:'',mode:'pieces',per:0,pallets:0,loose:0,qty:0,unit:'',verified:false};items.push(p)}p.brand=$('#brand').value.trim();p.mode=$('#mode').value;p.per=Math.max(0,+$('#per').value||0);p.pallets=Math.max(0,+$('#pallets').value||0);p.loose=Math.max(0,+$('#loose').value||0);p.qty=Math.max(0,+(p.mode==='pallet'?$('#qtyPallet').value:$('#qty').value)||0);p.unit=$('#unit').value.trim();p.verified=$('#verified').checked;save();$('#dlg').close();render()});
$('#add').addEventListener('click',()=>{$('#id').value='';$('#dlgTitle').textContent='Nuovo prodotto';$('#dlgBrand').textContent='';$('#nameWrap').hidden=false;$('#productName').value='';$('#brand').value='';$('#mode').value='pieces';$('#per').value=0;$('#pallets').value=0;$('#loose').value=0;$('#qtyPallet').value=0;$('#qty').value=0;$('#unit').value='';$('#verified').checked=false;$('#del').hidden=true;showFields();$('#dlg').showModal()});
$('#del').addEventListener('click',()=>{const id=+$('#id').value;if(id&&confirm('Eliminare questo prodotto?')){items=items.filter(x=>x.id!==id);save();$('#dlg').close();render()}});
$('#cancel').addEventListener('click',()=>$('#dlg').close());$('#mode').addEventListener('change',showFields);['#per','#pallets','#loose'].forEach(s=>$(s).addEventListener('input',calc));
$('#minus').addEventListener('click',()=>$('#qtyPallet').value=Math.max(0,(+$('#qtyPallet').value||0)-1));$('#plus').addEventListener('click',()=>$('#qtyPallet').value=(+$('#qtyPallet').value||0)+1);
$('#search').addEventListener('input',render);$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#reset').addEventListener('click',()=>{if(confirm('Ripristinare i 62 prodotti iniziali?')){items=cloneSeed();save();render()}});
function downloadBlob(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function dateStamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
$('#exportJson').addEventListener('click',()=>{const data={app:'Magazzino FB',version:2,exportedAt:new Date().toISOString(),items};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'Magazzino_FB_'+dateStamp()+'.json')});
$('#importJson').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',()=>{const file=$('#importFile').files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),arr=Array.isArray(parsed)?parsed:parsed&&Array.isArray(parsed.items)?parsed.items:null;if(!arr)throw new Error('Formato non valido');const cleaned=arr.map((x,i)=>({id:Number(x.id)||Date.now()+i,name:String(x.name||'').trim()||'Prodotto',brand:String(x.brand||''),mode:['pieces','pallet','direct'].includes(x.mode)?x.mode:'pieces',per:Math.max(0,Number(x.per)||0),pallets:Math.max(0,Number(x.pallets)||0),loose:Math.max(0,Number(x.loose)||0),qty:Math.max(0,Number(x.qty)||0),unit:String(x.unit||''),verified:!!x.verified}));if(!cleaned.length)throw new Error('Il file non contiene prodotti');if(confirm('Importare '+cleaned.length+' prodotti? I dati attuali verranno sostituiti.')){items=cleaned;save();render();alert('Importazione completata.')}}catch(err){alert('Impossibile importare il file JSON: '+err.message)}finally{$('#importFile').value=''}};r.readAsText(file)});
function asciiText(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'?')}
function pdfEscape(s){return asciiText(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function wrapText(s,max=92){const words=asciiText(s).split(/\s+/),out=[];let line='';for(const w of words){if(!w)continue;const n=line?line+' '+w:w;if(n.length>max&&line){out.push(line);line=w}else line=n}if(line)out.push(line);return out}
function productReportLine(p,i){if(p.mode==='pieces')return (i+1)+'. '+p.name+(p.brand?' - '+p.brand:'')+' | '+fmt(p.pallets)+' pallet x '+fmt(p.per)+' pz'+(p.loose?' + '+fmt(p.loose)+' sfusi':'')+' = '+fmt(total(p))+' pz | '+(p.verified?'Verificato':'Da verificare');if(p.mode==='pallet')return (i+1)+'. '+p.name+(p.brand?' - '+p.brand:'')+' | '+fmt(p.qty)+' pallet | '+(p.verified?'Verificato':'Da verificare');return (i+1)+'. '+p.name+(p.brand?' - '+p.brand:'')+' | '+fmt(p.qty)+' '+(p.unit||'unita')+' | '+(p.verified?'Verificato':'Da verificare')}
function buildPdf(pages){const n=pages.length,fontObj=3+n*2,objs=[];objs[1]='<< /Type /Catalog /Pages 2 0 R >>';const kids=[];for(let i=0;i<n;i++)kids.push((3+i*2)+' 0 R');objs[2]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>';for(let i=0;i<n;i++){const pageObj=3+i*2,contentObj=4+i*2,stream=pages[i];objs[pageObj]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 '+fontObj+' 0 R >> >> /Contents '+contentObj+' 0 R >>';objs[contentObj]='<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'}objs[fontObj]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';let pdf='%PDF-1.4\n%1234\n',offsets=[0];for(let i=1;i<=fontObj;i++){offsets[i]=pdf.length;pdf+=i+' 0 obj\n'+objs[i]+'\nendobj\n'}const xref=pdf.length;pdf+='xref\n0 '+(fontObj+1)+'\n0000000000 65535 f \n';for(let i=1;i<=fontObj;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+='trailer\n<< /Size '+(fontObj+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';return pdf}
function exportPdfFile(){const now=new Date(),verifiedCount=items.filter(x=>x.verified).length,totalPallets=items.reduce((a,p)=>a+(p.mode==='pieces'?(+p.pallets||0):p.mode==='pallet'?(+p.qty||0):0),0),totalPieces=items.reduce((a,p)=>a+(p.mode==='pieces'?total(p):0),0);let lines=[];items.forEach((p,i)=>lines.push(...wrapText(productReportLine(p,i),92)));const perPage=53,chunks=[];for(let i=0;i<lines.length;i+=perPage)chunks.push(lines.slice(i,i+perPage));if(!chunks.length)chunks.push([]);const pages=chunks.map((chunk,idx)=>{let c='BT\n/F1 14 Tf\n50 805 Td\n(MAGAZZINO FB - INVENTARIO) Tj\n/F1 8 Tf\n0 -18 Td\n('+pdfEscape('Esportato: '+now.toLocaleString('it-IT'))+') Tj\n0 -13 Td\n('+pdfEscape('Prodotti: '+items.length+' | Verificati: '+verifiedCount+' | Pallet: '+fmt(totalPallets)+' | Pezzi calcolati: '+fmt(totalPieces)) +') Tj\n0 -13 Td\n('+pdfEscape('Pagina '+(idx+1)+' di '+chunks.length)+') Tj\n0 -18 Td\n';for(const line of chunk)c+='('+pdfEscape(line)+') Tj\n0 -11 Td\n';return c+'ET'});const pdf=buildPdf(pages);downloadBlob(new Blob([pdf],{type:'application/pdf'}),'Magazzino_FB_'+dateStamp()+'.pdf')}
$('#exportPdf').addEventListener('click',exportPdfFile);
render();
</script></body></html>
