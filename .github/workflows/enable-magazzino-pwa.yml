name: Enable Magazzino FB PWA

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - enable-pwa.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo

      - name: Link manifest icon and service worker
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'rel="manifest"' not in s:
              marker = '<title>Magazzino FB Demo</title><meta name="theme-color" content="#0f172a">'
              replacement = '''<title>Magazzino FB</title><meta name="theme-color" content="#0f172a">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="default">
          <meta name="apple-mobile-web-app-title" content="Magazzino FB">
          <link rel="manifest" href="./manifest.webmanifest">
          <link rel="icon" type="image/png" href="./icons/icon-512.png">
          <link rel="apple-touch-icon" href="./icons/icon-512.png">'''
              if marker not in s:
                  raise SystemExit('head marker not found')
              s = s.replace(marker, replacement, 1)

          s = s.replace('Demo inventario magazzino alternativo · dati iniziali dal file Excel', 'Inventario magazzino alternativo · versione base di test')
          s = s.replace('Ripristina demo', 'Ripristina dati iniziali')

          if "navigator.serviceWorker.register('./service-worker.js')" not in s:
              sw = '''<script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Service worker:', err));
            });
          }
          </script>'''
              if '</body>' not in s:
                  raise SystemExit('body closing tag not found')
              s = s.replace('</body>', sw + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')

          scripts = re.findall(r'<script>([\s\S]*?)</script>', s)
          if not scripts:
              raise SystemExit('script not found')
          Path('/tmp/mfb-main.js').write_text(scripts[0], encoding='utf-8')

      - name: Check JavaScript
        run: node --check /tmp/mfb-main.js

      - name: Commit PWA page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable Magazzino FB PWA"
          git push origin HEAD:magazzino-fb-demo
