name: Finalize Magazzino FB icon

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - finalize-icon.trigger

permissions:
  contents: write

jobs:
  finalize-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo

      - name: Build centered borderless icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('icons/icon-512.png')
          img = Image.open(src).convert('RGB')
          w, h = img.size
          px = img.load()
          xs, ys = [], []
          for y in range(h):
              for x in range(w):
                  r, g, b = px[x, y]
                  if r > 150 and r > g * 1.45 and r > b * 1.45 and g < 150 and b < 150:
                      xs.append(x); ys.append(y)
          if not xs:
              raise SystemExit('Red frame not detected')
          bbox = (min(xs), min(ys), max(xs)+1, max(ys)+1)
          crop = img.crop(bbox)

          canvas = 512
          frame_size = 430
          crop = crop.resize((frame_size, frame_size), Image.Resampling.LANCZOS)
          out = Image.new('RGB', (canvas, canvas), (145,145,145))
          off = (canvas-frame_size)//2
          out.paste(crop, (off, off))
          out.save('icons/icon-512.png', 'PNG', optimize=True)
          out.resize((192,192), Image.Resampling.LANCZOS).save('icons/icon-192.png','PNG',optimize=True)
          out.resize((180,180), Image.Resampling.LANCZOS).save('icons/apple-touch-icon.png','PNG',optimize=True)
          PY

      - name: Refresh PWA cache metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          manifest={
            'name':'Magazzino FB',
            'short_name':'Magazzino FB',
            'description':'Inventario magazzino alternativo',
            'id':'./',
            'start_url':'./',
            'scope':'./',
            'display':'standalone',
            'background_color':'#919191',
            'theme_color':'#0f172a',
            'prefer_related_applications':False,
            'icons':[
              {'src':'icons/icon-192.png?v=5','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'icons/icon-512.png?v=5','sizes':'512x512','type':'image/png','purpose':'any maskable'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="manifest"[^>]*>','<link rel="manifest" href="./manifest.webmanifest?v=5">',s,count=1)
          s=re.sub(r'<link rel="icon"[^>]*>','<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=5">',s,count=1)
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>','<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=5">',s,count=1)
          p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js')
          if sw.exists():
              t=sw.read_text(encoding='utf-8')
              t=re.sub(r"const CACHE_NAME = 'magazzino-fb-pwa-v\d+';","const CACHE_NAME = 'magazzino-fb-pwa-v5';",t)
              sw.write_text(t,encoding='utf-8')
          PY

      - name: Validate icons
        run: |
          python - <<'PY'
          from PIL import Image
          for p,expected in [('icons/icon-512.png',(512,512)),('icons/icon-192.png',(192,192)),('icons/apple-touch-icon.png',(180,180))]:
              im=Image.open(p); im.verify()
              im=Image.open(p)
              assert im.size == expected, (p, im.size)
              print(p, im.size, 'OK')
          PY

      - name: Remove temporary files and commit
        run: |
          rm -f icon-upload-debug.txt noop.txt ignore-me.tmp dummy mistake-marker mistake-marker-2 blob-test-ignore zz-test oops-again zz-test blob-test-ignore icon-upload-debug.txt noop.txt
          rm -f ignore-me.tmp dummy mistake-marker mistake-marker-2 oops-again
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js icons/icon-512.png icons/icon-192.png icons/apple-touch-icon.png
          git add -u
          git commit -m "Finalize centered borderless Magazzino FB icon" || exit 0
          git push origin HEAD:magazzino-fb-demo
