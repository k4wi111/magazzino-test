name: Fix Magazzino FB icons

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - pwa-icon-fix.trigger

permissions:
  contents: write

jobs:
  fix-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo

      - name: Generate Android and Apple icon sizes
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('icons/icon-512.png')
          if not src.exists():
              raise SystemExit('icons/icon-512.png not found')
          img = Image.open(src).convert('RGBA')
          img.resize((192,192), Image.Resampling.LANCZOS).save('icons/icon-192.png', optimize=True)
          img.resize((180,180), Image.Resampling.LANCZOS).save('icons/apple-touch-icon.png', optimize=True)
          PY

      - name: Update manifest, page and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manifest = {
            'name': 'Magazzino FB',
            'short_name': 'Magazzino FB',
            'description': 'Inventario magazzino alternativo',
            'id': './',
            'start_url': './',
            'scope': './',
            'display': 'standalone',
            'background_color': '#f3f4f6',
            'theme_color': '#0f172a',
            'icons': [
              {'src':'icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'icons/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index = Path('index.html').read_text(encoding='utf-8')
          index = index.replace('<link rel="manifest" href="./manifest.webmanifest">','<link rel="manifest" href="./manifest.webmanifest?v=2">')
          index = index.replace('<link rel="icon" type="image/png" href="./icons/icon-512.png">','<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=2">')
          index = index.replace('<link rel="apple-touch-icon" href="./icons/icon-512.png">','<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=2">')
          Path('index.html').write_text(index, encoding='utf-8')

          sw = Path('service-worker.js').read_text(encoding='utf-8')
          sw = sw.replace("const CACHE_NAME = 'magazzino-fb-pwa-v1';", "const CACHE_NAME = 'magazzino-fb-pwa-v2';")
          sw = sw.replace("  './manifest.webmanifest',\n  './icons/icon-512.png'", "  './manifest.webmanifest',\n  './icons/icon-192.png',\n  './icons/icon-512.png',\n  './icons/apple-touch-icon.png'")
          Path('service-worker.js').write_text(sw, encoding='utf-8')
          PY

      - name: Commit icon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js icons/icon-192.png icons/apple-touch-icon.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix PWA icon sizes for Android and Apple"
          git push origin HEAD:magazzino-fb-demo
