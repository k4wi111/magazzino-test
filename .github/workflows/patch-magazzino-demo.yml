name: Patch Magazzino FB v6

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - patch-v6.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo

      - name: Redesign verification checkbox
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label}: pattern not found')
              s = s.replace(old, new, 1)

          css_anchor = '.pending{font-size:12px;color:#6b7280;margin-top:3px}'
          css_new = css_anchor + '#verified{accent-color:#16a34a}.verify-state{display:inline;font-weight:650;color:#6b7280}.verify-state.verified{color:#15803d}'
          replace_once(css_anchor, css_new, 'verification css')

          replace_once(
              '<button class="chip" data-f="pending">Da verificare</button>',
              '<button class="chip" data-f="pending">Non verificati</button>',
              'pending filter label'
          )

          replace_once(
              '<label><input id="verified" type="checkbox" style="width:auto;min-height:auto;margin-right:7px">Da verificare</label>',
              '<label><input id="verified" type="checkbox" style="width:auto;min-height:auto;margin-right:7px"><span id="verifyText" class="verify-state">Non verificato</span></label>',
              'verification control'
          )

          replace_once(
              "status.textContent=p.verified?'✓ Verificato':'Da verificare';",
              "status.textContent=p.verified?'☑ Verificato':'☐ Non verificato';",
              'row verification text'
          )

          marker = 'function positionDialogForKeyboard(){'
          helper = "function updateVerifyLabel(){const c=$('#verified'),t=$('#verifyText');if(!c||!t)return;t.textContent=c.checked?'Verificato':'Non verificato';t.classList.toggle('verified',c.checked)}\n"
          if helper.strip() not in s:
              replace_once(marker, helper + marker, 'verification helper')

          replace_once(
              "$('#qtyPallet').value=p.palletCount||0;$('#verified').checked=!p.verified;$('#del').hidden=false;renderPartials();showFields();showDialogAtTop()}",
              "$('#qtyPallet').value=p.palletCount||0;$('#verified').checked=false;updateVerifyLabel();$('#del').hidden=false;renderPartials();showFields();showDialogAtTop()}",
              'edit checkbox default'
          )

          replace_once(
              "p.palletCount=Math.floor(cleanNum($('#qtyPallet').value));p.verified=!$('#verified').checked;save();",
              "p.palletCount=Math.floor(cleanNum($('#qtyPallet').value));p.verified=$('#verified').checked;save();",
              'save verified state'
          )

          replace_once(
              "$('#qtyPallet').value=0;$('#verified').checked=true;$('#del').hidden=true;renderPartials();showFields();showDialogAtTop()});",
              "$('#qtyPallet').value=0;$('#verified').checked=false;updateVerifyLabel();$('#del').hidden=true;renderPartials();showFields();showDialogAtTop()});",
              'new checkbox default'
          )

          listener_anchor = "$('#mode').addEventListener('change',showFields);"
          listener = "$('#verified').addEventListener('change',updateVerifyLabel);"
          if listener not in s:
              replace_once(listener_anchor, listener_anchor + listener, 'verification change listener')

          replace_once(
              "status:p.verified?'VERIFICATO':'DA VERIFICARE'",
              "status:p.verified?'VERIFICATO':'NON VERIFICATO'",
              'pdf verification label'
          )

          replace_once('version:4,exportedAt', 'version:5,exportedAt', 'json version')

          p.write_text(s, encoding='utf-8')

          m = re.search(r'<script>([\s\S]*)</script>', s)
          if not m:
              raise SystemExit('script block missing')
          Path('/tmp/magazzino-v6.js').write_text(m.group(1), encoding='utf-8')

      - name: Check JavaScript
        run: node --check /tmp/magazzino-v6.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Redesign verification checkbox"
          git push origin HEAD:magazzino-fb-demo
