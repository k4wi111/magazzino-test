name: Deploy Magazzino FB v4

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - deploy-v4.trigger

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo

      - name: Rebuild app from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy-v4/chunk*.txt | tr -d '\n\r ' | base64 --decode > index.html
          echo "ecb86d45f83d913878bace3b0fa6d3d1fb1da965467ecaedf6ac5f242886ad01  index.html" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>([\s\S]*)</script>', s)
          if not m:
              raise SystemExit('Script block not found')
          Path('/tmp/magazzino-app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/magazzino-app.js

      - name: Commit redesigned app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Redesign pallet quantity counting"
          git push origin HEAD:magazzino-fb-demo
