name: Fix swipe delete v13

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - '.github/swipe-delete-v13.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo
          fetch-depth: 0

      - name: Apply swipe delete reliability fix
        run: python .github/fix-swipe-delete-v13.py

      - name: Commit changes and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/fix-swipe-delete-v13.py .github/swipe-delete-v13.trigger .github/workflows/fix-swipe-delete-v13.yml
          git add index.html service-worker.js
          git commit -m "Improve swipe delete tap reliability"
          git push origin magazzino-fb-demo
