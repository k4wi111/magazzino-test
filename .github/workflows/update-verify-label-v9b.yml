name: Update verify label v9b

on:
  push:
    branches:
      - magazzino-fb-demo

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo
          fetch-depth: 0

      - name: Replace verify labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          count = s.count('Non verificato')
          if count < 1:
              raise SystemExit('No lowercase Non verificato labels found')
          s = s.replace('Non verificato', 'Verifica')
          p.write_text(s, encoding='utf-8')
          print('Replaced', count, 'labels')
          PY

      - name: Bump PWA cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("magazzino-fb-pwa-v8", "magazzino-fb-pwa-v9")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Use Verifica and Verificato labels" || exit 0
          git push origin magazzino-fb-demo
