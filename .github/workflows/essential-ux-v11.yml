name: Essential UX safeguards v11

on:
  push:
    paths:
      - 'essential-ux-v11.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo
          fetch-depth: 0

      - name: Apply essential safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              s = s.replace(old, new, 1)

          once(
              '.row::after{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 4px 4px 0;background:#bfdbfe}',
              '.row::after{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 4px 4px 0;background:#f59e0b}\n.row.row-verified::after{background:#16a34a}\n.row.row-pending::after{background:#f59e0b}',
              'row status colors'
          )
          once('.pending{font-size:12px;color:#7b8799;margin-top:4px}', '.pending{font-size:12px;color:#475569;margin-top:4px;font-weight:650}', 'pending contrast')
          once('.hint{font-size:11px;color:#718096;margin-top:3px;line-height:1.3}', '.hint{font-size:11px;color:#475569;margin-top:3px;line-height:1.3}', 'hint contrast')

          once('<button type="button" id="minusFull">−</button>', '<button type="button" id="minusFull" aria-label="Diminuisci pedane complete">−</button>', 'minus full aria')
          once('<button type="button" id="plusFull">+</button>', '<button type="button" id="plusFull" aria-label="Aumenta pedane complete">+</button>', 'plus full aria')
          once('<button type="button" id="minusPallet">−</button>', '<button type="button" id="minusPallet" aria-label="Diminuisci pedane totali">−</button>', 'minus pallet aria')
          once('<button type="button" id="plusPallet">+</button>', '<button type="button" id="plusPallet" aria-label="Aumenta pedane totali">+</button>', 'plus pallet aria')

          once("function save(){localStorage.setItem(KEY,JSON.stringify(items))}", "function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(err){console.error('Salvataggio locale fallito:',err);alert('ATTENZIONE: impossibile salvare i dati sul dispositivo. Non chiudere l’app e crea subito un backup JSON.');return false}}", 'safe save')
          once("el.className='row';", "el.className='row '+(p.verified?'row-verified':'row-pending');", 'dynamic row class')
          once("$('#verified').checked=false;updateVerifyLabel();$('#del').hidden=false;", "$('#verified').checked=!!p.verified;updateVerifyLabel();$('#del').hidden=false;", 'preserve verified in edit')
          once("p.verified=$('#verified').checked;save();$('#dlg').close();render()", "p.verified=$('#verified').checked;if(!save())return;$('#dlg').close();render()", 'save guard submit')

          once("items=items.filter(x=>x.id!==id);save();$('#dlg').close();render()", "const previous=items;items=items.filter(x=>x.id!==id);if(!save()){items=previous;return}$('#dlg').close();render()", 'save guard delete')
          once("if(confirm('Ripristinare i 62 prodotti iniziali?')){items=cloneSeed();save();render()}", "if(confirm('Ripristinare i 62 prodotti iniziali?')){const previous=items;items=cloneSeed();if(!save()){items=previous;return}render()}", 'save guard reset')
          once("if(confirm('Importare '+cleaned.length+' prodotti? I dati attuali verranno sostituiti.')){items=cleaned;save();render();alert('Importazione completata.')}", "if(confirm('Importare '+cleaned.length+' prodotti? I dati attuali verranno sostituiti.')){const previous=items;items=cleaned;if(!save()){items=previous;return}render();alert('Importazione completata.')}", 'save guard import')

          p.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          t = sw.read_text(encoding='utf-8')
          if "magazzino-fb-pwa-v10" not in t:
              raise SystemExit('service worker v10 marker not found')
          t = t.replace('magazzino-fb-pwa-v10', 'magazzino-fb-pwa-v11', 1)
          sw.write_text(t, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Add essential UX and data safeguards"
          git push origin HEAD:magazzino-fb-demo
