name: Remove Magazzino FB subtitle

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - remove-subtitle.trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo
      - name: Remove subtitle under Magazzino FB
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<header><h1>Magazzino FB</h1><p>Inventario magazzino alternativo · versione base di test</p></header>'
          new = '<header><h1>Magazzino FB</h1></header>'
          if old not in s:
              raise SystemExit('Subtitle text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          rm -f remove-subtitle.trigger .github/workflows/remove-magazzino-subtitle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html remove-subtitle.trigger .github/workflows/remove-magazzino-subtitle.yml
          git commit -m "Remove subtitle under Magazzino FB"
          git push origin HEAD:magazzino-fb-demo
