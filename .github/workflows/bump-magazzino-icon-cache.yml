name: Bump Magazzino FB icon cache

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - pwa-icon-cache-v4.trigger

permissions:
  contents: write

jobs:
  bump-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo

      - name: Bump icon and manifest cache version
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('manifest.webmanifest?v=3','manifest.webmanifest?v=4')
          s=s.replace('icon-192.png?v=3','icon-192.png?v=4')
          s=s.replace('apple-touch-icon.png?v=3','apple-touch-icon.png?v=4')
          p.write_text(s,encoding='utf-8')

          p=Path('manifest.webmanifest')
          s=p.read_text(encoding='utf-8')
          s=s.replace('icon-192.png?v=3','icon-192.png?v=4')
          s=s.replace('icon-512.png?v=3','icon-512.png?v=4')
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("magazzino-fb-pwa-v3","magazzino-fb-pwa-v4")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js
          git commit -m "Bump Magazzino FB icon cache to v4"
          git push origin HEAD:magazzino-fb-demo
