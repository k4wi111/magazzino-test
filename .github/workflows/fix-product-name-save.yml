name: Fix product name save

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - '.github/product-name-save-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo
      - name: Fix existing product name editing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_open = "$('#nameWrap').hidden=true;$('#productName').value=p.name;"
          new_open = "$('#nameWrap').hidden=false;$('#productName').value=p.name;"
          if old_open not in s:
              raise SystemExit('openEdit target not found')
          s = s.replace(old_open, new_open, 1)

          old_submit = "const isNew=!p;if(isNew){const newName=$('#productName').value.trim();if(!newName){alert('Inserisci il nome del prodotto.');return}p={id:Date.now(),name:newName,brand:'',mode:'quantity',um:'PZ',per:0,fullPallets:0,additional:0,partials:[],palletCount:0,verified:false};items.push(p)}p.brand="
          new_submit = "const isNew=!p;const newName=$('#productName').value.trim();if(!newName){alert('Inserisci il nome del prodotto.');return}if(isNew){p={id:Date.now(),name:newName,brand:'',mode:'quantity',um:'PZ',per:0,fullPallets:0,additional:0,partials:[],palletCount:0,verified:false};items.push(p)}p.name=newName;p.brand="
          if old_submit not in s:
              raise SystemExit('submit target not found')
          s = s.replace(old_submit, new_submit, 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('service-worker.js')
          sws = sw.read_text(encoding='utf-8')
          sws = sws.replace("magazzino-fb-pwa-v7", "magazzino-fb-pwa-v8")
          sw.write_text(sws, encoding='utf-8')
          PY
      - name: Validate fix
        run: |
          grep -F "p.name=newName;p.brand=" index.html
          grep -F "magazzino-fb-pwa-v8" service-worker.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Fix editing names of existing products"
          git push origin magazzino-fb-demo
