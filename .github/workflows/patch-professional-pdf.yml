name: Patch Magazzino FB professional PDF

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - patch-professional-pdf.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo
      - name: Patch PDF generator
        run: python patch-professional-pdf.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve inventory PDF layout"
          git push
