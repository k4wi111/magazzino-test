name: Run swipe delete v12

on:
  push:
    branches:
      - magazzino-fb-demo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo
          fetch-depth: 0
      - name: Apply patch
        run: python swipe_patch_v12.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm swipe_patch_v12.py .github/workflows/run-swipe-delete-v12.yml
          git add index.html service-worker.js
          git commit -m "Add swipe to delete with undo"
          git push origin magazzino-fb-demo
