name: Add swipe delete v12

on:
  push:
    branches:
      - magazzino-fb-demo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo
          fetch-depth: 0

      - name: Add swipe to delete with undo
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = ".list{display:grid;gap:9px}\n"
          css_add = """.list{display:grid;gap:9px}
.swipe-item{position:relative;overflow:hidden;border-radius:16px;background:#b91c1c;box-shadow:0 3px 12px rgba(15,23,42,.045)}
.swipe-item .row{box-shadow:none}
.swipe-delete{position:absolute;right:0;top:0;bottom:0;width:102px;min-height:0;border-radius:0;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:12px;font-weight:800;z-index:0}
.swipe-delete svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.swipe-delete:active{transform:none;filter:brightness(.94)}
.swipe-content{position:relative;z-index:1;touch-action:pan-y;will-change:transform;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.swipe-content.swipe-dragging{transition:none}
.swipe-content.swipe-open{transform:translateX(-102px)}
"""
          if css_anchor not in s:
              raise SystemExit('CSS list anchor not found')
          s = s.replace(css_anchor, css_add, 1)

          dialog_anchor = "\ndialog{border:0;"
          undo_css = """
.undo-bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;z-index:30;display:flex;align-items:center;gap:18px;max-width:calc(100% - 28px);min-width:270px;background:#172033;color:#fff;border-radius:14px;padding:10px 12px 10px 15px;box-shadow:0 12px 34px rgba(15,23,42,.28);transition:opacity .18s ease,transform .18s ease}
.undo-bar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.undo-bar span{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo-bar button{margin-left:auto;min-height:36px;padding:0 10px;background:transparent;color:#7dd3fc;border-radius:9px;font-weight:800}
"""
          if dialog_anchor not in s:
              raise SystemExit('Dialog CSS anchor not found')
          s = s.replace(dialog_anchor, '\n' + undo_css + 'dialog{border:0;', 1)

          html_anchor = "</form></dialog>\n<script>"
          html_new = """</form></dialog>
<div id=\"undoBar\" class=\"undo-bar\" role=\"status\" aria-live=\"polite\"><span id=\"undoText\">Prodotto eliminato</span><button type=\"button\" id=\"undoBtn\">Annulla</button></div>
<script>"""
          if html_anchor not in s:
              raise SystemExit('Dialog HTML anchor not found')
          s = s.replace(html_anchor, html_new, 1)

          vars_anchor = "let filter='all',editingPartials=[];"
          vars_new = "let filter='all',editingPartials=[];\nlet openSwipeContent=null,lastDeleted=null,undoTimer=null;\nconst SWIPE_WIDTH=102;"
          if vars_anchor not in s:
              raise SystemExit('State variables anchor not found')
          s = s.replace(vars_anchor, vars_new, 1)

          render_anchor = "function render(){"
          helpers = r"""
function setSwipe(content,open){
  if(open){
    if(openSwipeContent&&openSwipeContent!==content)setSwipe(openSwipeContent,false);
    content.style.transform='';content.classList.add('swipe-open');content.dataset.open='1';openSwipeContent=content;
  }else{
    content.style.transform='';content.classList.remove('swipe-open');content.dataset.open='0';if(openSwipeContent===content)openSwipeContent=null;
  }
}
function bindSwipe(content){
  let sx=0,sy=0,start=0,pos=0,tracking=false,horizontal=false;
  const finish=()=>{if(!tracking)return;tracking=false;content.classList.remove('swipe-dragging');if(!horizontal){content.style.transform='';return}content.dataset.ignoreClick=String(Date.now()+350);setSwipe(content,pos<-SWIPE_WIDTH/2);horizontal=false};
  content.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(openSwipeContent&&openSwipeContent!==content)setSwipe(openSwipeContent,false);sx=e.clientX;sy=e.clientY;start=content.dataset.open==='1'?-SWIPE_WIDTH:0;pos=start;tracking=true;horizontal=false;try{content.setPointerCapture(e.pointerId)}catch{}});
  content.addEventListener('pointermove',e=>{if(!tracking)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!horizontal){if(Math.abs(dy)>9&&Math.abs(dy)>Math.abs(dx)){tracking=false;content.style.transform='';return}if(Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)){horizontal=true;content.classList.add('swipe-dragging')}else return}e.preventDefault();pos=Math.max(-SWIPE_WIDTH,Math.min(0,start+dx));content.style.transform=`translateX(${pos}px)`});
  content.addEventListener('pointerup',finish);content.addEventListener('pointercancel',finish);
}
function hideUndo(){clearTimeout(undoTimer);undoTimer=null;const bar=$('#undoBar');if(bar)bar.classList.remove('show')}
function showUndo(name){clearTimeout(undoTimer);const bar=$('#undoBar');$('#undoText').textContent=(name||'Prodotto')+' eliminato';bar.classList.add('show');undoTimer=setTimeout(()=>{lastDeleted=null;hideUndo()},5500)}
function deleteProductWithUndo(id){const index=items.findIndex(x=>x.id===id);if(index<0)return;const product=items[index];items.splice(index,1);if(!save()){items.splice(index,0,product);render();return}lastDeleted={product,index};render();showUndo(product.name)}
"""
          if render_anchor not in s:
              raise SystemExit('Render anchor not found')
          s = s.replace(render_anchor, helpers + render_anchor, 1)

          old = "$('#list').innerHTML='';$('#count').textContent=arr.length;"
          new = "$('#list').innerHTML='';openSwipeContent=null;$('#count').textContent=arr.length;"
          if old not in s:
              raise SystemExit('Render list reset anchor not found')
          s = s.replace(old,new,1)

          old = "for(const p of arr){const el=document.createElement('article');el.className='row '+(p.verified?'row-verified':'row-pending');"
          new = "for(const p of arr){const swipe=document.createElement('div');swipe.className='swipe-item';const delSwipe=document.createElement('button');delSwipe.type='button';delSwipe.className='swipe-delete';delSwipe.setAttribute('aria-label','Elimina '+p.name);delSwipe.innerHTML='<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 6h18\"></path><path d=\"M8 6V4h8v2\"></path><path d=\"M19 6l-1 14H6L5 6\"></path><path d=\"M10 11v5M14 11v5\"></path></svg><span>Elimina</span>';const el=document.createElement('article');el.className='row swipe-content '+(p.verified?'row-verified':'row-pending');"
          if old not in s:
              raise SystemExit('Render row creation anchor not found')
          s = s.replace(old,new,1)

          old = "left.addEventListener('click',()=>openEdit(p.id));"
          new = "left.addEventListener('click',()=>{if(Number(el.dataset.ignoreClick||0)>Date.now())return;if(el.dataset.open==='1'){setSwipe(el,false);return}openEdit(p.id)});"
          if old not in s:
              raise SystemExit('Row click anchor not found')
          s = s.replace(old,new,1)

          old = "el.append(left,right);$('#list').append(el)"
          new = "el.append(left,right);swipe.append(delSwipe,el);$('#list').append(swipe);bindSwipe(el);delSwipe.addEventListener('click',()=>deleteProductWithUndo(p.id))"
          if old not in s:
              raise SystemExit('Row append anchor not found')
          s = s.replace(old,new,1)

          end_anchor = "$('#exportPdf').addEventListener('click',exportPdfFile);\nrender();"
          end_new = """$('#exportPdf').addEventListener('click',exportPdfFile);
$('#undoBtn').addEventListener('click',()=>{if(!lastDeleted)return;const entry=lastDeleted;const pos=Math.min(entry.index,items.length);items.splice(pos,0,entry.product);if(!save()){items.splice(pos,1);return}lastDeleted=null;hideUndo();render()});
document.addEventListener('pointerdown',e=>{if(openSwipeContent&&!e.target.closest('.swipe-item'))setSwipe(openSwipeContent,false)},true);
render();"""
          if end_anchor not in s:
              raise SystemExit('Final render anchor not found')
          s = s.replace(end_anchor,end_new,1)

          p.write_text(s,encoding='utf-8')

          sw = Path('service-worker.js')
          w = sw.read_text(encoding='utf-8')
          if "magazzino-fb-pwa-v11" not in w:
              raise SystemExit('Expected v11 cache not found')
          w = w.replace("magazzino-fb-pwa-v11","magazzino-fb-pwa-v12",1)
          sw.write_text(w,encoding='utf-8')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-swipe-delete-v12.yml
          git add index.html service-worker.js
          git commit -m "Add swipe to delete with undo"
          git push origin magazzino-fb-demo
