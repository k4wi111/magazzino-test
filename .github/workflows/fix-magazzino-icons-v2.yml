name: Rebuild Magazzino FB icons

on:
  push:
    branches:
      - magazzino-fb-demo
    paths:
      - pwa-icon-fix-v2.trigger

permissions:
  contents: write

jobs:
  rebuild-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magazzino-fb-demo

      - name: Build valid FB icons
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageOps
          from pathlib import Path

          Path('icons').mkdir(exist_ok=True)
          S=1024
          img=Image.new('RGB',(S,S),(248,248,248))
          d=ImageDraw.Draw(img)
          # outer rounded plate
          d.rounded_rectangle((34,34,990,990), radius=155, fill=(168,168,168), outline=(122,122,122), width=3)
          # red square frame
          d.rectangle((90,112,934,910), fill=(225,39,54))
          # dark inner panel
          d.rectangle((137,160,887,862), fill=(92,92,92))

          # letter layer with deep shadow
          try:
              font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 545)
          except:
              font=ImageFont.load_default()

          # Build individual masks so F can be mirrored like the supplied logo
          def make_letter(ch, mirror=False):
              layer=Image.new('L',(600,700),0)
              ld=ImageDraw.Draw(layer)
              bbox=ld.textbbox((0,0),ch,font=font)
              w,h=bbox[2]-bbox[0],bbox[3]-bbox[1]
              ld.text(((600-w)//2-bbox[0], (700-h)//2-bbox[1]), ch, font=font, fill=255)
              if mirror:
                  layer=ImageOps.mirror(layer)
              return layer

          fmask=make_letter('F', mirror=True)
          bmask=make_letter('B', mirror=False)

          def paste_letter(mask, xy):
              x,y=xy
              # extruded dark shadow
              for off,shade in [(30,(45,43,42)),(22,(54,51,50)),(14,(67,63,61)),(8,(76,72,69))]:
                  col=Image.new('RGB',mask.size,shade)
                  img.paste(col,(x+off,y+off),mask)
              # soft cast shadow
              soft=mask.filter(ImageFilter.GaussianBlur(13))
              sh=Image.new('RGB',mask.size,(34,34,34))
              img.paste(sh,(x+12,y+18),soft.point(lambda p:int(p*0.55)))
              # face
              face=Image.new('RGB',mask.size,(242,240,234))
              img.paste(face,(x,y),mask)

          paste_letter(fmask,(80,205))
          paste_letter(bmask,(430,205))

          # subtle texture on letter faces / plate
          px=img.load()
          import random
          random.seed(7)
          for _ in range(18000):
              x=random.randrange(120,900); y=random.randrange(170,855)
              r,g,b=px[x,y]
              if r>220 and g>215 and b>205:
                  delta=random.choice([-10,-7,-4,4,7])
                  px[x,y]=(max(0,min(255,r+delta)),max(0,min(255,g+delta)),max(0,min(255,b+delta)))

          def save(size,path):
              out=img.resize((size,size), Image.Resampling.LANCZOS)
              out.save(path,'PNG',optimize=True)

          save(512,'icons/icon-512.png')
          save(192,'icons/icon-192.png')
          save(180,'icons/apple-touch-icon.png')
          PY

      - name: Update PWA metadata and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manifest={
            'name':'Magazzino FB',
            'short_name':'Magazzino FB',
            'description':'Inventario magazzino alternativo',
            'id':'./',
            'start_url':'./',
            'scope':'./',
            'display':'standalone',
            'background_color':'#f3f4f6',
            'theme_color':'#0f172a',
            'prefer_related_applications':False,
            'icons':[
              {'src':'icons/icon-192.png?v=3','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'icons/icon-512.png?v=3','sizes':'512x512','type':'image/png','purpose':'any'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<link rel="manifest"[^>]*>','<link rel="manifest" href="./manifest.webmanifest?v=3">',s,count=1)
          s=re.sub(r'<link rel="icon"[^>]*>','<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=3">',s,count=1)
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>','<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=3">',s,count=1)
          p.write_text(s,encoding='utf-8')

          sw=Path('service-worker.js').read_text(encoding='utf-8')
          sw=re.sub(r"const CACHE_NAME = 'magazzino-fb-pwa-v\d+';","const CACHE_NAME = 'magazzino-fb-pwa-v3';",sw)
          start=sw.find('const CORE = [')
          end=sw.find('];',start)
          if start!=-1 and end!=-1:
              core="const CORE = [\n  './',\n  './index.html',\n  './manifest.webmanifest',\n  './icons/icon-192.png',\n  './icons/icon-512.png',\n  './icons/apple-touch-icon.png'\n]"
              sw=sw[:start]+core+sw[end+1:]
          Path('service-worker.js').write_text(sw,encoding='utf-8')
          PY

      - name: Validate generated icons
        run: |
          python - <<'PY'
          from PIL import Image
          for p,size in [('icons/icon-192.png',(192,192)),('icons/icon-512.png',(512,512)),('icons/apple-touch-icon.png',(180,180))]:
              im=Image.open(p)
              im.verify()
              im=Image.open(p)
              assert im.size==size,(p,im.size)
              print(p,im.size,'OK')
          PY

      - name: Commit fixed PWA icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png
          git commit -m "Rebuild valid PWA icons for Magazzino FB"
          git push origin HEAD:magazzino-fb-demo
